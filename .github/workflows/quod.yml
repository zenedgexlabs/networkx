# E9: Quod on GitHub-hosted CI, generated by conformance/ci_replay.py.
# A push to main records the map; each pull request runs two jobs on the
# same commit:
#   shadow  - the full suite, plus the list of tests Quod would skip
#             (a would-skip test that fails is an escape);
#   enforce - only the tests Quod doesn't skip (the time it saves).
name: quod
on:
  push: { branches: [main] }
  pull_request:

# A new push to a branch cancels its run in progress.
concurrency:
  group: quod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60   # a mutant can make the suite loop forever
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: 'pip install -e ''.[default,test]'' pytest'
      - uses: zenedgexlabs/quod-action@v0.1.0-alpha.7
        with: { mode: record, quod-version: latest, test-command: 'python -m pytest networkx -q', python: python }


  pr:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix: { mode: [shadow, enforce] }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: 'pip install -e ''.[default,test]'' pytest'
      - uses: zenedgexlabs/quod-action@v0.1.0-alpha.7
        with: { mode: '${{ matrix.mode }}', quod-version: latest, test-command: 'python -m pytest networkx -q', python: python }

